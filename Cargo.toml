[workspace]
resolver = "2"
members = [
    "crates/embedded-dsp",
    "crates/embedded-dsp-studio",
]
# Standalone link targets, built by their own CI jobs and kept out of
# `--workspace` builds: `fuzz` needs a nightly toolchain, and the C ABI must not
# inherit `embedded-dsp`'s `defmt` feature into its cdylib link.
exclude = ["fuzz", "crates/embedded-dsp-ffi"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.93"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/embedded-dsp"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
# `docsrs` is set by `[package.metadata.docs.rs].rustdoc-args` (see the crate
# manifest) so `#[cfg_attr(docsrs, doc(cfg(...)))]` adds feature-gate badges on
# docs.rs only. Declaring the custom cfg keeps `unexpected_cfgs` quiet under
# `-D warnings` on stable, where the cfg is never set.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
# The DSP kernels are written as index loops over parallel arrays; many index
# several slices at once or use the index arithmetically, where the iterator
# form is less clear rather than more. Allow this one stylistic lint repo-wide
# so that `clippy::all` can be denied in CI without blanket noise.
needless_range_loop = "allow"

[workspace.dependencies]
embedded-dsp = { path = "crates/embedded-dsp", version = "0.5.1", default-features = false }
fixed = { version = "1.31.0", default-features = false }
libm = { version = "0.2.11" }
defmt = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
bytemuck = { version = "1.24.0", default-features = false, features = ["derive"] }
quickcheck = { version = "1.0.3", default-features = false }
quickcheck_macros = { version = "1.0.0" }
miniconf = { version = "0.21.0", default-features = false }
# Test-only oracle for the composable Kalman models (dev-dependency of `embedded-dsp`).
idsp = { version = "0.22.1", default-features = false }

eframe = { version = "0.36", default-features = true }
egui_extras = { version = "0.36" }
rfd = "0.17"
log = "0.4"

[package]
name = "embedded-dsp-bench"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", default-features = false }
defmt = "1.0.1"
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }

embedded-dsp = { path = "../../crates/embedded-dsp", default-features = false, features = ["libm", "full", "fixed"] }

[profile.dev]
debug = 'full'
opt-level = 's'

[profile.release]
debug = 'full'
codegen-units = 1
incremental = false
lto = true
opt-level = 2

[features]
default = ["rtt"]
rtt = ["dep:defmt-rtt", "dep:panic-probe"]

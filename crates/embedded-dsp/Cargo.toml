[package]
name = "embedded-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A no_std Rust digital signal processing library for microcontrollers, embedded systems, and real-time signals."
readme = "../../README.md"
license.workspace = true
repository.workspace = true
keywords = ["dsp", "embedded", "no_std", "signal-processing", "fft"]
categories = ["embedded", "no-std", "science"]

[lints]
workspace = true

[features]
# Default matches a "give me the whole crate" install. Opt out with
# `default-features = false` and pick `libm`/`std` plus the modules you want
# (or `full` for every algorithm module).
default = ["std", "libm", "full", "fixed"]
std = []
libm = ["dep:libm"]
fixed = ["dep:fixed"]
defmt = ["dep:defmt", "fixed?/defmt"]
serde = ["dep:serde", "fixed?/serde"]
bytemuck = ["dep:bytemuck"]
# Conversions between the `[f32; 4]` quaternion representation used by
# `quaternion` and `nalgebra`'s `Quaternion`/`UnitQuaternion`.
nalgebra = ["quaternion", "dep:nalgebra"]
alloc = []
cortex-m-dsp = []

# Enables every algorithm module. Independent of `std`/`libm` so no_std
# consumers can use `default-features = false, features = ["libm", "full"]`.
full = [
    "audio",
    "basic-math",
    "beamforming",
    "companding",
    "complex-math",
    "const-generics",
    "controller",
    "cordic",
    "distance",
    "dsm",
    "dither",
    "dynamics",
    "fast-math",
    "filter-analysis",
    "filter-design",
    "filtering",
    "fixed-point",
    "interpolation",
    "kalman",
    "lut",
    "matrix",
    "pipeline",
    "pll",
    "psd",
    "quaternion",
    "resampling",
    "spatial",
    "statistics",
    "snapshot",
    "synthesis",
    "validation",
    "support",
    "transform",
    "window",
]

# Per-module features: pull in only the algorithms you need.
audio = ["transform", "filter-design"]
basic-math = []
beamforming = ["transform"]
companding = []
complex-math = ["fast-math"]
const-generics = ["filtering", "matrix"]
controller = ["filtering"]
cordic = ["fast-math"]
distance = ["fast-math"]
dsm = []
dither = []
dynamics = ["pipeline"]
fast-math = []
filter-analysis = []
filter-design = ["filter-analysis", "support"]
filtering = []
# Q16.16 saturating arithmetic (rasterizer / no-FPU pipelines). Complements
# the always-on CMSIS-style q7/q15/q31 fixed-point types in `types`.
fixed-point = []
interpolation = []
kalman = ["matrix"]
# Precomputed 256-entry sin/cos tables (i16), an alternative to `fast-math`.
lut = []
matrix = ["basic-math"]
pipeline = ["filtering"]
pll = []
psd = ["transform", "window"]
quaternion = []
resampling = []
spatial = []
statistics = ["fast-math"]
snapshot = []
synthesis = []
validation = []
support = []
transform = []
window = []

[dependencies]
fixed = { workspace = true, optional = true }
libm = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
nalgebra = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Integration tests are declared explicitly so each can carry `required-features`.
# Without this, `cargo test --no-default-features --features <subset>` failed to
# compile tests that reference modules outside the selected subset.
[[test]]
name = "basic_math_coverage"
path = "tests/basic_math_coverage.rs"
required-features = ["libm", "basic-math"]

[[test]]
name = "filtering_coverage"
path = "tests/filtering_coverage.rs"
required-features = ["libm", "filtering"]

[[test]]
name = "fixed_basic_types_transform"
path = "tests/fixed_basic_types_transform.rs"
required-features = ["libm", "basic-math", "transform"]

[[test]]
name = "high_roi_features_test"
path = "tests/high_roi_features_test.rs"
required-features = [
    "libm",
    "controller",
    "fast-math",
    "filter-analysis",
    "filtering",
    "pipeline",
    "pll",
    "resampling",
    "synthesis",
]

[[test]]
name = "matrix_window_support_fastmath"
path = "tests/matrix_window_support_fastmath.rs"
required-features = ["libm", "fast-math", "matrix", "support", "window"]

[[test]]
name = "push_to_95_coverage_b"
path = "tests/push_to_95_coverage_b.rs"
required-features = ["libm", "full"]

[[test]]
name = "push_to_95_coverage_d"
path = "tests/push_to_95_coverage_d.rs"
required-features = ["libm", "full"]

[[test]]
name = "split_process_biquad_quickcheck"
path = "tests/split_process_biquad_quickcheck.rs"
required-features = ["libm", "filtering", "pipeline"]

[[test]]
name = "stats_interp_distance_complex_coverage"
path = "tests/stats_interp_distance_complex_coverage.rs"
required-features = [
    "libm",
    "complex-math",
    "distance",
    "interpolation",
    "statistics",
]


# pre-commit configuration for local CI checks
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check (all-features)
        entry: cargo check --lib --all-features
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check-no-std
        name: cargo check (no_std)
        # Scoped with `-p`: the `embedded-dsp-studio` member enables `embedded-dsp`'s `std`
        # feature, and an unscoped check unifies that across the workspace, which cannot build
        # for a bare-metal target. CI already scopes this the same way.
        entry: cargo check -p embedded-dsp --lib --no-default-features --features libm,full --target thumbv7em-none-eabihf
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --lib --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-doc
        name: cargo doc (-D warnings)
        entry: bash .github/scripts/ci_docs.sh
        language: system
        types: [rust]
        pass_filenames: false

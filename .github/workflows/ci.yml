name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MSRV: "1.93"
  # Minimum line coverage for the `embedded-dsp` library, enforced by the
  # coverage job below. Keep in sync with `coverage.status.project` in
  # codecov.yml (that config only takes effect once the Codecov GitHub App is
  # installed and posting status checks; this env var is what actually gates).
  COVERAGE_MIN: "95"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  check-no-std:
    name: Check (no_std - ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi       # Cortex-M0/M0+ (pure integer, no FPU)
          - thumbv7em-none-eabi      # Cortex-M4 (no FPU)
          - thumbv7em-none-eabihf    # Cortex-M4F/M7 (hardware FPU)
          - thumbv8m.main-none-eabihf # Cortex-M33/M55 (hardware FPU)
          - riscv32imc-unknown-none-elf # RISC-V embedded (ESP32-C3)
          - wasm32-unknown-unknown   # WebAssembly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check build for ${{ matrix.target }} (libm, full)
        run: cargo check -p embedded-dsp --target ${{ matrix.target }} --no-default-features --features full,libm
      - name: Check build for ${{ matrix.target }} with cortex-m-dsp (if ARM)
        if: startsWith(matrix.target, 'thumbv7em') || startsWith(matrix.target, 'thumbv8m')
        run: cargo check -p embedded-dsp --target ${{ matrix.target }} --no-default-features --features full,libm,cortex-m-dsp

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p embedded-dsp --no-default-features --features full,libm

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy -p embedded-dsp --no-default-features --features full,libm --target thumbv7em-none-eabihf -- -D warnings

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Each module feature builds standalone
        run: |
          for feature in \
            basic-math complex-math filtering controller cordic distance dither dsm \
            fast-math filter-analysis filter-design fixed-point interpolation kalman lut \
            matrix pipeline pll psd quaternion resampling spatial statistics snapshot \
            synthesis validation support transform window companding const-generics \
            audio beamforming miniconf; do
            echo "::group::libm,$feature"
            cargo check -p embedded-dsp --no-default-features --features "libm,$feature" --target thumbv7em-none-eabihf
            echo "::endgroup::"
          done
      - name: Representative feature subsets (tests)
        run: |
          for features in \
            "libm,basic-math" \
            "libm,filtering" \
            "libm,filtering,pipeline" \
            "libm,complex-math,distance,interpolation,statistics" \
            "libm,matrix,support,window,fast-math" \
            "libm,controller,fast-math,filter-analysis,filtering,pipeline,pll,resampling,synthesis" \
            "full,libm"; do
            echo "::group::$features"
            cargo test -p embedded-dsp --no-default-features --features "$features"
            echo "::endgroup::"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Run unit & integration tests (default features)
        run: cargo test --workspace --all-targets --all-features
      - name: Run tests (no-default-features + libm + full)
        run: cargo test -p embedded-dsp --no-default-features --features full,libm

  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    # Informational: compares the public API against the latest crates.io release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/ci_docs.sh

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p embedded-dsp --dry-run

  audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Coverage measures the `embedded-dsp` DSP library. The
      # `embedded-dsp-studio` egui GUI is excluded (see codecov.yml), and the
      # two feature configurations are merged so the reported number matches
      # what codecov derives from the uploaded lcov.
      - name: Measure library code coverage
        run: |
          echo "### 📊 Code Coverage Report (embedded-dsp library)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report -p embedded-dsp --all-features
          cargo llvm-cov --no-report -p embedded-dsp --no-default-features --features full,libm
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --lcov --output-path lcov.info
      # The codecov.yml project target only applies once the Codecov GitHub App
      # is installed and posting status checks, which it currently is not. This
      # step makes the floor real: it fails the job when library line coverage
      # drops below COVERAGE_MIN.
      - name: Enforce coverage floor
        run: |
          pct="$(cargo llvm-cov report --summary-only | awk '$1 == "TOTAL" { gsub(/%/, "", $10); print $10 }')"
          if [ -z "$pct" ]; then
            echo "::error::could not read the coverage total from 'cargo llvm-cov report'"
            exit 1
          fi
          echo "library line coverage: ${pct}% (floor: ${COVERAGE_MIN}%)"
          awk -v pct="$pct" -v min="$COVERAGE_MIN" 'BEGIN {
            if (pct + 0 < min + 0) {
              printf "::error::library line coverage %.2f%% is below the %.2f%% floor\n", pct, min
              exit 1
            }
          }'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leftger/embedded-dsp
      - name: Install nextest
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@nextest
      - name: Run tests with JUnit report
        if: ${{ !cancelled() }}
        run: |
          set +e
          cargo nextest run --workspace --all-features --profile ci
          status=$?
          cp target/nextest/ci/junit.xml junit.xml
          exit $status
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: leftger/embedded-dsp
          report_type: test_results

  bench:
    name: Benchmarks (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run native DSP benchmarks and check baseline
        run: |
          echo "### ⏱️ Native DSP Benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cargo bench -p embedded-dsp --bench dsp_benchmarks -- \
            --check-baseline "$GITHUB_WORKSPACE/crates/embedded-dsp/benches/dsp_baseline.txt" \
            --max-regression 3.0 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  embedded-bench:
    name: Embedded Bench (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded benchmark harness (biquad + idsp parity)
        run: cargo build --release --target thumbv7em-none-eabihf
        working-directory: tests/embedded


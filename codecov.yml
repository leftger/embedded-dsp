# Codecov configuration.
#
# Where the coverage gate actually lives: the enforcing check is the "Enforce
# coverage floor" step in .github/workflows/ci.yml, driven by the COVERAGE_MIN
# env var. It has no dependency on a third-party app or plan. The statuses
# configured below take effect only once the Codecov GitHub App is installed and
# posting checks; keep `coverage.status.project.default.target` in sync with
# COVERAGE_MIN (currently 95).
ignore:
  - "benches/**"
  - "**/benches/**"
  - "examples/**"
  - "**/examples/**"
  - "embedded-dsp-docs.zip"
  - "**/embedded-dsp-docs.zip"
  # The `embedded-dsp-studio` desktop GUI (egui/eframe) is excluded from the
  # coverage metric: its `views/` and `widgets/` modules are immediate-mode
  # rendering code exercised only when a window is drawn, so unit-testing it
  # would mostly assert that painting does not panic. Coverage therefore
  # measures the `embedded-dsp` DSP library.
  - "crates/embedded-dsp-studio/**"
  - "**/embedded-dsp-studio/**"

# Inline annotations in the PR "Files changed" tab are a paid Codecov feature.
# With them enabled and no paid plan, Codecov can attempt the Checks API and
# fail to fall back to a plain status, leaving no `codecov/project` check at
# all. Disabling them keeps the status check, which is the part that matters.
github_checks:
  annotations: false

coverage:
  status:
    project:
      default:
        # Explicit: an `enabled: false` appearing here would otherwise silently
        # disable the status.
        enabled: true
        # Target the library floor rather than the previous `auto` (which only
        # compared against the base commit and allowed a 1% dip every time).
        # `threshold` is the permitted shortfall, so this reports failure below
        # 94.5%. The half-point of slack absorbs runner-level noise:
        # coverage-mapping differences between llvm-cov builds make
        # #[inline(always)] functions report as unexecuted on CI, which costs
        # ~0.3 points versus an identical local run.
        #
        # Ceiling note: ~92 lines (transform.rs twiddle tables, fast_math.rs
        # CORDIC table, lut.rs) are `const fn`s evaluated only at compile time,
        # so no test can mark them executed. Practical maximum is therefore
        # just under 100%, not 100%.
        target: 95%
        threshold: 0.5%
    patch:
      default:
        enabled: true
        # Deliberately lower than the project target: new code rarely starts as
        # well covered as the library average. Raise it if the library number
        # starts eroding from below.
        target: 60%
        threshold: 1%

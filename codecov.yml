# Codecov configuration.
#
# Where the coverage gate actually lives: the enforcing check is the "Enforce
# coverage floor" step in .github/workflows/ci.yml, driven by the COVERAGE_MIN
# env var. It has no dependency on a third-party app or plan. The statuses
# configured below take effect only once the Codecov GitHub App is installed and
# posting checks; keep `coverage.status.project.default.target` in sync with
# COVERAGE_MIN (currently 95).
#
# Score only the core embedded-dsp library (crates/embedded-dsp). Sibling
# crates (studio, …) and non-library trees are excluded.
ignore:
  - "benches/**"
  - "**/benches/**"
  - "examples/**"
  - "**/examples/**"
  - "embedded-dsp-docs.zip"
  - "**/embedded-dsp-docs.zip"
  # The `embedded-dsp-studio` desktop GUI (egui/eframe) is excluded from the
  # coverage metric: its `views/` and `widgets/` modules are immediate-mode
  # rendering code exercised only when a window is drawn, so unit-testing it
  # would mostly assert that painting does not panic. Coverage therefore
  # measures the `embedded-dsp` DSP library.
  - "crates/embedded-dsp-*/**"
  - "**/embedded-dsp-studio/**"

# Inline annotations in the PR "Files changed" tab are enabled by default, but
# Codecov is deprecating them (annotations cannot be cleared once sent, and they
# conflict with Flags/Components). Disabling them is also the documented
# fallback path: "If GitHub checks are disabled but statuses are still set up,
# normal status checks will be used instead", so `codecov/project` is still
# posted. See https://docs.codecov.com/docs/github-checks
github_checks:
  annotations: false

# The PR comment is patch-only by default ("By default, Codecov only shows
# coverage changes on the git diff on the pull request comment"). Setting
# `hide_project_coverage: false` and asking for the `files` section makes the
# comment report overall project coverage as well, which is the number this
# repository actually cares about -- the library floor.
# See https://docs.codecov.com/docs/common-recipe-list
comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false # post even when coverage is unchanged
  require_base: false    # no base report required
  require_head: true     # a head report is required
  hide_project_coverage: false

coverage:
  status:
    project:
      default:
        # NOTE: only keys documented at
        # https://docs.codecov.com/docs/commit-status are used here. Statuses are
        # enabled by default; the documented way to disable one is `project:
        # false`, not an `enabled:` key, which that reference lists nowhere. An
        # unrecognised key is rejected server-side, and with
        # `fail_ci_if_error: false` in the workflow that rejection is silent.
        #
        # Target the library floor rather than the previous `auto` (which only
        # compared against the base commit and allowed a 1% dip every time).
        # `threshold` is the permitted shortfall, so this reports failure below
        # 94.5%. The half-point of slack absorbs runner-level noise:
        # coverage-mapping differences between llvm-cov builds make
        # #[inline(always)] functions report as unexecuted on CI, which costs
        # ~0.3 points versus an identical local run.
        #
        # Ceiling note: ~92 lines (transform.rs twiddle tables, fast_math.rs
        # CORDIC table, lut.rs) are `const fn`s evaluated only at compile time,
        # so no test can mark them executed. Practical maximum is therefore
        # just under 100%, not 100%.
        target: 95%
        threshold: 0.5%
        paths:
          - crates/embedded-dsp
    patch:
      default:
        # Deliberately lower than the project target: new code rarely starts as
        # well covered as the library average. Raise it if the library number
        # starts eroding from below.
        target: 60%
        threshold: 1%
        paths:
          - crates/embedded-dsp

ignore:
  - "benches/**"
  - "**/benches/**"
  - "examples/**"
  - "**/examples/**"
  - "embedded-dsp-docs.zip"
  - "**/embedded-dsp-docs.zip"
  # The `embedded-dsp-studio` desktop GUI (egui/eframe) is excluded from the
  # coverage metric: its `views/` and `widgets/` modules are immediate-mode
  # rendering code exercised only when a window is drawn, so unit-testing it
  # would mostly assert that painting does not panic. Coverage therefore
  # measures the `embedded-dsp` DSP library.
  - "crates/embedded-dsp-studio/**"
  - "**/embedded-dsp-studio/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 60%
        threshold: 1%
